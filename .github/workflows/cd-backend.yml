name: Deploy Backend to AWS ECS

on:
  push:
    branches: [ release ]
    paths:
      - 'backend/**'
      - '.github/workflows/cd-backend.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even without backend changes'
        type: boolean
        default: false

env:
  AWS_REGION: ap-south-1
  PROJECT_NAME: cbaas
  AWS_ACCOUNT_ID: 577897067437

jobs:
  deploy:
    name: Build and Deploy Django Backend
    runs-on: ubuntu-latest
    
    # OIDC permissions
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-BackendDeploy

      # Step 3: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Set up image tag
      - name: Set image tag
        id: image-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          IMAGE_TAG="release-${SHORT_SHA}"
          ECR_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT_NAME }}-backend"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "ECR_URI=${ECR_URI}" >> $GITHUB_OUTPUT
          echo "FULL_IMAGE_URI=${ECR_URI}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      # Step 5: Build and push Docker image to ECR
      - name: Build and push Docker image
        working-directory: ./backend
        run: |
          echo "Building Django backend image..."
          docker build -f Dockerfile.backend \
            -t ${{ steps.image-tag.outputs.FULL_IMAGE_URI }} \
            -t ${{ steps.image-tag.outputs.ECR_URI }}:latest .
          
          echo "Pushing versioned image to ECR..."
          docker push ${{ steps.image-tag.outputs.FULL_IMAGE_URI }}
          
          echo "Pushing latest tag to ECR..."
          docker push ${{ steps.image-tag.outputs.ECR_URI }}:latest
          
          echo "✅ Images pushed:"
          echo "  Versioned: ${{ steps.image-tag.outputs.FULL_IMAGE_URI }}"
          echo "  Latest: ${{ steps.image-tag.outputs.ECR_URI }}:latest"

      # Step 6: Register new ECS task definition
      - name: Register new ECS task definition
        id: register-task-def
        run: |
          echo "Creating new task definition..."
          
          # Get the secret ARN with the AWS-generated suffix
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id ${{ env.PROJECT_NAME }}/backend/env \
            --query 'ARN' \
            --output text)
          
          echo "Using Secrets Manager ARN: $SECRET_ARN"
          
          # Create task definition JSON
          cat > task-definition.json <<EOF
          {
            "family": "${{ env.PROJECT_NAME }}-backend-task",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT_NAME }}-task-execution-role",
            "taskRoleArn": "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT_NAME }}-task-execution-role",
            "containerDefinitions": [
              {
                "name": "${{ env.PROJECT_NAME }}-backend",
                "image": "${{ steps.image-tag.outputs.FULL_IMAGE_URI }}",
                "portMappings": [
                  {
                    "containerPort": 8000,
                    "protocol": "tcp"
                  }
                ],
                "essential": true,
                "secrets": [
                  {
                    "name": "DJANGO_SECRET_KEY",
                    "valueFrom": "${SECRET_ARN}:DJANGO_SECRET_KEY::"
                  },
                  {
                    "name": "DEBUG",
                    "valueFrom": "${SECRET_ARN}:DEBUG::"
                  },
                  {
                    "name": "ALLOWED_HOSTS",
                    "valueFrom": "${SECRET_ARN}:ALLOWED_HOSTS::"
                  },
                  {
                    "name": "DATABASE_URL",
                    "valueFrom": "${SECRET_ARN}:DATABASE_URL::"
                  },
                  {
                    "name": "CORS_ALLOWED_ORIGINS",
                    "valueFrom": "${SECRET_ARN}:CORS_ALLOWED_ORIGINS::"
                  },
                  {
                    "name": "CORS_ALLOW_CREDENTIALS",
                    "valueFrom": "${SECRET_ARN}:CORS_ALLOW_CREDENTIALS::"
                  }
                ],
                "environment": [
                  {
                    "name": "DJANGO_ENV",
                    "value": "prod"
                  },
                  {
                    "name": "AWS_DEFAULT_REGION",
                    "value": "${{ env.AWS_REGION }}"
                  }
                ],
                "healthCheck": {
                  "command": [
                    "CMD-SHELL",
                    "curl -f http://localhost:8000/api/healthz || exit 1"
                  ],
                  "interval": 30,
                  "timeout": 5,
                  "retries": 3,
                  "startPeriod": 60
                },
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/${{ env.PROJECT_NAME }}-backend",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          
          # Register the task definition
          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.revision' \
            --output text)
          
          echo "NEW_REVISION=${NEW_REVISION}" >> $GITHUB_OUTPUT
          echo "✅ New task definition registered: ${{ env.PROJECT_NAME }}-backend-task:${NEW_REVISION}"
          
          # Clean up
          rm -f task-definition.json

      # Step 7: Update ECS service
      - name: Update ECS service
        run: |
          echo "Updating ECS service..."
          
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-cluster"
          SERVICE_NAME="${{ env.PROJECT_NAME }}-backend-service"
          TASK_DEFINITION="${{ env.PROJECT_NAME }}-backend-task:${{ steps.register-task-def.outputs.NEW_REVISION }}"
          
          # Check if service exists
          if aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].serviceName' \
            --output text 2>/dev/null | grep -q "$SERVICE_NAME"; then
            
            echo "Service exists, updating..."
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$SERVICE_NAME" \
              --task-definition "$TASK_DEFINITION" \
              --force-new-deployment > /dev/null
            
            echo "✅ Service update initiated"
          else
            echo "Service doesn't exist, creating..."
            
            # Get network configuration
            VPC_ID=$(aws ec2 describe-vpcs --filters "Name=is-default,Values=true" --query 'Vpcs[0].VpcId' --output text)
            SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[*].SubnetId' --output text)
            SUBNET_ID_1=$(echo $SUBNET_IDS | cut -d' ' -f1)
            SUBNET_ID_2=$(echo $SUBNET_IDS | cut -d' ' -f2)
            if [ -z "$SUBNET_ID_2" ]; then SUBNET_ID_2="$SUBNET_ID_1"; fi
            
            ECS_SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=${{ env.PROJECT_NAME }}-ecs-sg" --query 'SecurityGroups[0].GroupId' --output text)
            TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups --names "${{ env.PROJECT_NAME }}-tg" --query 'TargetGroups[0].TargetGroupArn' --output text)
            
            # Create service
            aws ecs create-service \
              --cluster "$CLUSTER_NAME" \
              --service-name "$SERVICE_NAME" \
              --task-definition "$TASK_DEFINITION" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID_1,$SUBNET_ID_2],securityGroups=[$ECS_SG_ID],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=$TARGET_GROUP_ARN,containerName=${{ env.PROJECT_NAME }}-backend,containerPort=8000" \
              --enable-execute-command > /dev/null
            
            echo "✅ Service created"
          fi

      # Step 8: Wait for deployment to stabilize
      - name: Wait for stable deployment
        timeout-minutes: 10
        run: |
          echo "Waiting for deployment to stabilize (max 10 minutes)..."
          
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-cluster"
          SERVICE_NAME="${{ env.PROJECT_NAME }}-backend-service"
          
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            || {
              echo "⚠️ Deployment did not stabilize within timeout. Check service events:"
              aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --query 'services[0].events[0:5]'
              exit 1
            }
          
          echo "✅ Deployment completed successfully!"

      # Step 9: Get deployment summary
      - name: Get deployment summary
        id: deployment-summary
        run: |
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-cluster"
          SERVICE_NAME="${{ env.PROJECT_NAME }}-backend-service"
          
          # Get service status
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].{running:runningCount,desired:desiredCount,pending:pendingCount}' \
            --output json)
          
          RUNNING_COUNT=$(echo "$SERVICE_STATUS" | jq -r '.running')
          DESIRED_COUNT=$(echo "$SERVICE_STATUS" | jq -r '.desired')
          
          # Get ALB DNS
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ${{ env.PROJECT_NAME }}-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          
          echo "ALB_DNS=${ALB_DNS}" >> $GITHUB_OUTPUT
          echo "RUNNING_COUNT=${RUNNING_COUNT}" >> $GITHUB_OUTPUT
          echo "DESIRED_COUNT=${DESIRED_COUNT}" >> $GITHUB_OUTPUT

      # Step 10: Verify deployment health
      - name: Verify deployment health
        run: |
          echo "Waiting for targets to be healthy..."
          sleep 30
          
          # Check if the service is responding
          BACKEND_URL="http://${{ steps.deployment-summary.outputs.ALB_DNS }}"
          
          echo "Testing backend endpoint: ${BACKEND_URL}/api/healthz"
          
          # Try to reach the health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${BACKEND_URL}/api/healthz" || echo "000")
          
          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "✅ Backend is healthy and responding!"
          elif [[ "$HTTP_CODE" == "000" ]]; then
            echo "⚠️  Could not connect to backend. It might still be starting up."
          else
            echo "⚠️  Backend returned HTTP $HTTP_CODE."
          fi

      # Step 11: Output deployment summary
      - name: Output deployment summary
        run: |
          echo "## 🚀 Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.image-tag.outputs.FULL_IMAGE_URI }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Task Definition** | \`${{ env.PROJECT_NAME }}-backend-task:${{ steps.register-task-def.outputs.NEW_REVISION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECS Cluster** | \`${{ env.PROJECT_NAME }}-cluster\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECS Service** | \`${{ env.PROJECT_NAME }}-backend-service\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Running Tasks** | ${{ steps.deployment-summary.outputs.RUNNING_COUNT }}/${{ steps.deployment-summary.outputs.DESIRED_COUNT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend URL** | http://${{ steps.deployment-summary.outputs.ALB_DNS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Check** | http://${{ steps.deployment-summary.outputs.ALB_DNS }}/api/healthz |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Monitoring Commands" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Check service status" >> $GITHUB_STEP_SUMMARY
          echo "aws ecs describe-services --cluster ${{ env.PROJECT_NAME }}-cluster --services ${{ env.PROJECT_NAME }}-backend-service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# View CloudWatch logs" >> $GITHUB_STEP_SUMMARY
          echo "aws logs tail /ecs/${{ env.PROJECT_NAME }}-backend --follow --region ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY