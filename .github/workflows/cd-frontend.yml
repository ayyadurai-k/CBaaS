name: CD - Frontend to S3 + CloudFront

on:
  push:
    branches:
      - release
    paths:
      - 'frontend/**'
      - '.github/workflows/cd-frontend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Build frontend with Docker
        run: |
          cd frontend
          
          # Build with export stage using BuildKit
          docker buildx build \
            -f Dockerfile.s3 \
            --target export \
            --output type=local,dest=./dist \
            .
          
          # Verify build output
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed - index.html not found"
            exit 1
          fi
          
          echo "✅ Build artifacts extracted successfully"
          ls -lh dist/

      - name: Deploy to S3 and CloudFront
        run: |
          cd frontend/dist
          
          # Run deployment script
          ../../infra/aws/deploy_frontend.sh \
            ${{ secrets.S3_BUCKET }} \
            ${{ secrets.CF_DIST_ID }}

      - name: Deployment Summary
        run: |
          # Get CloudFront URL
          CLOUDFRONT_URL=$(aws cloudfront get-distribution \
            --id ${{ secrets.CF_DIST_ID }} \
            --query 'Distribution.DomainName' \
            --output text)
          
          # Output to job summary
          echo "## 🚀 Frontend Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**CloudFront URL:** https://$CLOUDFRONT_URL" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket:** ${{ secrets.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "**Distribution ID:** ${{ secrets.CF_DIST_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cache invalidation completed. Changes are live globally! ✨" >> $GITHUB_STEP_SUMMARY