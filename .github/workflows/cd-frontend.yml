name: CD - Frontend to S3 + CloudFront

on:
  push:
    branches:
      - release
    paths:
      - 'frontend/**'
      - '.github/workflows/cd-frontend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Build frontend with Docker
        run: |
          cd frontend
          
          # Build with export stage using BuildKit
          docker buildx build \
            -f Dockerfile.s3 \
            --target export \
            --output type=local,dest=./dist \
            .
          
          # Verify build output
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed - index.html not found"
            exit 1
          fi
          
          echo "✅ Build artifacts extracted successfully"
          ls -lh dist/

      - name: Deploy to S3 and CloudFront
        run: |
          # Make script executable
          chmod +x infra/aws/deploy_frontend.sh
          
          # Run deployment script from frontend directory
          # (script expects to find dist/ in current directory)
          cd frontend
          bash ../infra/aws/deploy_frontend.sh \
            ${{ secrets.S3_BUCKET }} \
            ${{ secrets.CF_DIST_ID }}

      - name: Deployment Summary
        run: |
          echo "## ✅ Frontend Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** \`${{ secrets.S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution:** \`${{ secrets.CF_DIST_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** \`ap-south-1\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Access Your App" >> $GITHUB_STEP_SUMMARY
          echo "Your frontend is now live and cached globally via CloudFront CDN!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Tip:** Changes may take 1-2 minutes to propagate globally due to cache invalidation." >> $GITHUB_STEP_SUMMARY