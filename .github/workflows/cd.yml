name: Deploy to AWS ECS

on:
  push:
    branches:
      - release   # trigger only on release branch

env:
  AWS_REGION: ap-south-1
  ACCOUNT_ID: 577897067437
  ECR_REGISTRY: 577897067437.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: cbaas-cluster
  FRONTEND_REPO: cbaas-frontend
  BACKEND_REPO: cbaas-backend
  WORKER_REPO: cbaas-worker
  FRONTEND_SERVICE: cbaas-frontend-service
  BACKEND_SERVICE: cbaas-backend-service
  WORKER_SERVICE: cbaas-worker-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $ECR_REGISTRY

      # ---------------- BUILD & PUSH ----------------

      - name: Build & Push Frontend
        run: |
          docker build -t $FRONTEND_REPO -f ./frontend/Dockerfile.prod ./frontend
          docker tag $FRONTEND_REPO:latest $ECR_REGISTRY/$FRONTEND_REPO:latest
          docker tag $FRONTEND_REPO:latest $ECR_REGISTRY/$FRONTEND_REPO:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$FRONTEND_REPO:latest
          docker push $ECR_REGISTRY/$FRONTEND_REPO:${GITHUB_SHA}

      - name: Build & Push Backend
        run: |
          docker build -t $BACKEND_REPO -f ./backend/Dockerfile.prod ./backend
          docker tag $BACKEND_REPO:latest $ECR_REGISTRY/$BACKEND_REPO:latest
          docker tag $BACKEND_REPO:latest $ECR_REGISTRY/$BACKEND_REPO:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$BACKEND_REPO:latest
          docker push $ECR_REGISTRY/$BACKEND_REPO:${GITHUB_SHA}

      - name: Build & Push Worker
        run: |
          docker build -t $WORKER_REPO -f ./backend/Dockerfile.prod ./backend
          docker tag $WORKER_REPO:latest $ECR_REGISTRY/$WORKER_REPO:latest
          docker tag $WORKER_REPO:latest $ECR_REGISTRY/$WORKER_REPO:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$WORKER_REPO:latest
          docker push $ECR_REGISTRY/$WORKER_REPO:${GITHUB_SHA}

      # ---------------- UPDATE TASK DEFINITIONS ----------------
      # Helper step: function to create new revisions

      - name: Register new task definition for frontend
        run: |
          TD=$(aws ecs describe-task-definition --task-definition $FRONTEND_SERVICE)
          NEW_TD=$(echo $TD | jq --arg IMAGE "$ECR_REGISTRY/$FRONTEND_REPO:${GITHUB_SHA}" \
            '.taskDefinition | .containerDefinitions[0].image=$IMAGE | 
             {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, volumes, requiresCompatibilities, cpu, memory}')
          echo $NEW_TD > frontend-td.json
          aws ecs register-task-definition --cli-input-json file://frontend-td.json

      - name: Register new task definition for backend
        run: |
          TD=$(aws ecs describe-task-definition --task-definition $BACKEND_SERVICE)
          NEW_TD=$(echo $TD | jq --arg IMAGE "$ECR_REGISTRY/$BACKEND_REPO:${GITHUB_SHA}" \
            '.taskDefinition | .containerDefinitions[0].image=$IMAGE | 
             {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, volumes, requiresCompatibilities, cpu, memory}')
          echo $NEW_TD > backend-td.json
          aws ecs register-task-definition --cli-input-json file://backend-td.json

      - name: Register new task definition for worker
        run: |
          TD=$(aws ecs describe-task-definition --task-definition $WORKER_SERVICE)
          NEW_TD=$(echo $TD | jq --arg IMAGE "$ECR_REGISTRY/$WORKER_REPO:${GITHUB_SHA}" \
            '.taskDefinition | .containerDefinitions[0].image=$IMAGE | 
             {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, volumes, requiresCompatibilities, cpu, memory}')
          echo $NEW_TD > worker-td.json
          aws ecs register-task-definition --cli-input-json file://worker-td.json

      # ---------------- DEPLOY ----------------

      - name: Update ECS Frontend Service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $FRONTEND_SERVICE \
            --force-new-deployment

      - name: Update ECS Backend Service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $BACKEND_SERVICE \
            --force-new-deployment

      - name: Update ECS Worker Service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $WORKER_SERVICE \
            --force-new-deployment
